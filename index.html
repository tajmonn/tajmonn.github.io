<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <title>Portfolio - Retro Desktop</title>

    <!-- CSS POTEM -->
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Desktop -->
    <div id="desktop">

        <!-- ICONS / FOLDERS -->
        <div class="icon folder" data-window="profile" style="top:5vh; left:5vw;">
            <img src="icons/text-file.png" alt="Text file icon" />
            <span>o_mnie
            </span>
        </div>

        <div class="icon folder" data-window="work" style="top:15vh; left:5vw;">
            <img src="icons/folder.png" alt="Folder icon" />
            <span>doświadczenie</span>
        </div>

        <div class="icon folder" data-window="contact" style="top:25vh; left:5vw;">
            <img src="icons/text-file.png" alt="Text file icon" />
            <span>kontakt</span>
        </div>

        <div class="icon folder" data-window="projects" style="top:5vh; left:25vw;">
            <img src="icons/folder.png" alt="Folder icon" />
            <span>projekty</span>
        </div>
    </div>


    <!-- WINDOWS-->
    <!-- PROFILE WINDOW -->
    <div class="window" id="window-profile" data-name="profile">
        <div class="title-bar">
            <span>C:\O_MNIE</span>
            <div class="window-controls">
                <button class="close">X</button>
            </div>
        </div>
        <div class="window-content" id="about"></div>
    </div>

    <!-- EXPERIENCE WINDOW -->
    <div class="window" id="window-work" data-name="work">
        <div class="title-bar">
            <span>C:\DOŚWIADCZENIE</span>
            <div class="window-controls">
                <button class="close">X</button>
            </div>
        </div>
        
        <div class="window-content">
            <div class="icon folder" data-window="experience-work" style="top:50px; left:10px;">
                <img src="icons/text-file.png" alt="Work experience" />
                <span>Doświadczenie_zawodowe.txt</span>
            </div>

            <div class="icon folder" data-window="experience-education" style="top:50px; left: 250px;">
                <img src="icons/text-file.png" alt="Education experience" />
                <span>Doświadczenie_edukacyjne.txt</span>
            </div>
        </div>
    </div>

        <!-- EXPERIENCE WORK -->
    <div class="window" id="window-work-experience" data-name="experience-work">
        <div class="title-bar">
            <span>C:\DOŚWIADCZENIE\DOŚWIADCZENIE_ZAWODOWE.TXT</span>
            <div class="window-controls">
                <button class="close">X</button>
            </div>
        </div>
        <div class="window-content" id="experience-work"></div>
    </div>

    <!-- EXPERIENCE EDU -->
    <div class="window" id="window-education-experience" data-name="experience-education">
        <div class="title-bar">
            <span>C:\DOŚWIADCZENIE\DOŚWIADCZENIE_EDUKACYJNE.TXT</span>
            <div class="window-controls">
                <button class="close">X</button>
            </div>
        </div>
        <div class="window-content" id="experience-education"></div>
    </div>

    <!-- CONTACT WINDOW -->
    <div class="window" data-name="contact" >
        <div class="title-bar">
            <span>C:\KONTAKT.TXT</span>
            <div class="window-controls">
                <button class="close">X</button>
            </div>
        </div>
        <div class="window-content" id="contact"></div>
    </div>

    <!-- PROJECTS WINDOW -->
    <div class="window" id="window-projects" data-name="projects">
        <div class="title-bar">
            <span>C:\PROJEKTY</span>
            <div class="window-controls">
                <button class="close">X</button>
            </div>
        </div>
        
        <div class="window-content">
            <div class="icon folder" data-window="project-website-riri" style="top:50px; left:10px;">
                <img src="icons/text-file.png" alt="Project website RiRi" />
                <span>Strona_RiRi.txt</span>
            </div>

        </div>
    </div>

    <!-- PROJECT RIRI WEBSITE-->
    <div class="window" id="window-project-website-riri" data-name="project-website-riri">
        <div class="title-bar">
            <span>C:\STRONA_RIRI.TXT</span>
            <div class="window-controls">
                <button class="close">X</button>
            </div>
        </div>
        <div class="window-content" id="project-website-riri"></div>
    </div>
    


    <!-- JS POTEM -->
    <script src="script.js"></script>

</body>
</html>
